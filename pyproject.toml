[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line too long
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:launch_ros -p no:launch_testing -p no:ament_xmllint -p no:ament_pep257 -p no:ament_lint -p no:ament_flake8 -p no:ament_copyright -v --tb=short"
